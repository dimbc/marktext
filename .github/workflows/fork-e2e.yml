name: Fork E2E (temporary)

# Temporary: runs the desktop Playwright suite on a fork branch, so it can be
# dispatched and re-run freely while the upstream PR check waits on a
# maintainer. Mirrors .github/workflows/e2e.yml; delete with the branch.
#
# The suite is known to drop a single random test per run, so the matrix runs
# the same commit several times side by side — several samples tell that apart
# from a real break.

on:
  push:
    branches:
      - ci-e2e
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxkbfile-dev libsecret-1-dev libfontconfig-dev \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libgtk-3-0 libgbm1 libasound2t64

      - uses: ./.github/actions/setup

      # Run the full postinstall: Electron binary download, patch-package,
      # electron-rebuild, and minify-locales.
      - name: Run postinstall
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: 'pnpm'
          USE_ELECTRON_CLANG: '0'

      - name: Build app
        run: pnpm build

      - name: Run E2E Tests (sample ${{ matrix.sample }})
        run: xvfb-run --auto-servernum pnpm test:e2e
